<!DOCTYPE html>
<html>
<head>
    <title>Simple App</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .container { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.2); border-radius: 5px; text-align: center; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Welcome</h1>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button onclick="greet()">Say Hello</button>
        <div id="result"></div>
    </div>
    <script>
        async function greet() {
            const name = document.getElementById('nameInput').value;
            const response = await fetch('/api/greet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name})
            });
            const data = await response.json();
            document.getElementById('result').innerText = data.message;
        }
    </script>
</body>
</html>
